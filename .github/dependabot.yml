---

version: 2

updates:
# Abstract dependency specs: `[project]` and `[dependency-groups]`.
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  groups:
    python-dependencies:
      patterns:
      - '*'
# Pinned lock files generated by `tox -e lock`.
#
# NOTE: Dependabot edits these pins in place; it does not re-run a universal
# NOTE: resolution, so it can neither create nor retire a marker fork. Run
# NOTE: `tox -e lock -- --upgrade` by hand when the supported Python range
# NOTE: changes.
- package-ecosystem: pip
  directory: /requirements
  schedule:
    interval: weekly
  groups:
    python-dependencies:
      patterns:
      - '*'

...
