name: CI

on:
  pull_request:
    paths-ignore:  # changes to the cron workflow are triggered through it
    - .github/workflows/scheduled-runs.yml
  push:
  workflow_call:  # a way to embed the main tests


env:
  UPSTREAM_REPOSITORY_ID: >-
    245499251


jobs:
  pre-setup:
    name: ⚙️ Pre-set global build settings

    runs-on: ubuntu-latest

    timeout-minutes: 2

    defaults:
      run:
        shell: python

    outputs:
      # NOTE: These aren't env vars because the `${{ env }}` context is
      # NOTE: inaccessible when passing inputs to reusable workflows.
      upstream-repository-id: ${{ env.UPSTREAM_REPOSITORY_ID }}
      is-debug-mode: ${{ toJSON(runner.debug == '1') }}
      cache-key-files: >-
        ${{ steps.calc-cache-key-files.outputs.files-hash-key }}

    steps:
    # NOTE: `hashFiles()` resolves paths against `GITHUB_WORKSPACE`, so the
    # NOTE: sources must be present for it to return anything but an empty
    # NOTE: string. The reusable-workflow callers below have no checkout of
    # NOTE: their own, which is why the hash is computed here and passed in.
    - name: Check out src from Git
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: >-
        Calculate dependency files' combined hash value
        for use in the cache key
      id: calc-cache-key-files
      run: |
        from os import environ
        from pathlib import Path

        FILE_APPEND_MODE = 'a'

        with Path(environ['GITHUB_OUTPUT']).open(
                mode=FILE_APPEND_MODE,
        ) as outputs_file:
            print(
                "files-hash-key=${{
                    hashFiles(
                      'pyproject.toml', 'tox.ini', 'requirements/*.txt'
                    )
                }}",
                file=outputs_file,
            )

  sanity:
    name: 🧹 Linters${{ '' }}  # nest jobs under the same sidebar category
    needs:
    - pre-setup

    strategy:
      fail-fast: false
      matrix:
        runner-vm-os:
        - ubuntu-24.04
        python-version:
        - 3.12
        toxenv:
        - linters
        - build-docs
        xfail:
        - false

    uses: tox-dev/workflow/.github/workflows/reusable-tox.yml@1bb961580e20073f66ccb9024f248357f8c8fecb  # yamllint disable-line rule:line-length
    with:
      cache-key-for-dependency-files: >-
        ${{ needs.pre-setup.outputs.cache-key-files }}
      check-name: >-
        ${{ matrix.toxenv }}
        under 🐍${{ matrix.python-version }}
      python-version: >-
        ${{ matrix.python-version }}
      require-successful-codecov-uploads: >-
        ${{
          toJSON(
          needs.pre-setup.outputs.upstream-repository-id
          == github.repository_id
          )
        }}
      runner-vm-os: >-
        ${{ matrix.runner-vm-os }}
      timeout-minutes: 2
      toxenv: >-
        ${{ matrix.toxenv }}
      xfail: >-
        ${{ fromJSON(matrix.xfail) }}
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  tests:
    name: 🧪 Tests${{ '' }}  # nest jobs under the same sidebar category

    needs:
    - pre-setup  # transitive, for accessing settings

    strategy:
      fail-fast: >-  # ${{ runner.debug }} is unavailable in this context
        ${{
          fromJSON(needs.pre-setup.outputs.is-debug-mode)
          && false
          || true
        }}
      matrix:
        python-version:
        # NOTE: The latest and the lowest supported Pythons are prioritized
        # NOTE: to improve the responsiveness. It's nice to see the most
        # NOTE: important results first.
        - 3.15
        - 3.11
        - 3.14
        - 3.13
        - 3.12
        runner-vm-os:
        - ubuntu-24.04
        toxenv:
        - integration
        - unit
        xfail:
        - false

    uses: tox-dev/workflow/.github/workflows/reusable-tox.yml@1bb961580e20073f66ccb9024f248357f8c8fecb  # yamllint disable-line rule:line-length
    with:
      cache-key-for-dependency-files: >-
        ${{ needs.pre-setup.outputs.cache-key-files }}
      check-name: >-
        ${{ matrix.toxenv }}
        under 🐍${{ matrix.python-version }}
      checkout-src-git-fetch-depth: >-
        ${{ matrix.toxenv == 'unit' && 1 || 0 }}
      job-dependencies-context: >-  # context for hooks
        ${{ toJSON(needs) }}
      python-version: >-
        ${{ matrix.python-version }}
      require-successful-codecov-uploads: >-
        ${{
          toJSON(
          needs.pre-setup.outputs.upstream-repository-id
          == github.repository_id
          )
        }}
      runner-vm-os: >-
        ${{ matrix.runner-vm-os }}
      timeout-minutes: >-
        ${{ matrix.toxenv == 'unit' && 2 || 11 }}
      toxenv: >-
        ${{ matrix.toxenv }}
      tox-run-posargs: >-
        --run-destructive
        --cov-report=xml:.tox/.tmp/.test-results/pytest-${{
          matrix.python-version
        }}/cobertura.xml
        --junitxml=.tox/.tmp/.test-results/pytest-${{
          matrix.python-version
        }}/test.xml
      tox-rerun-posargs: >-
        --run-destructive
        --no-cov
        -vvvvv
        --lf
      xfail: >-
        ${{ fromJSON(matrix.xfail) }}
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  check:  # This job does nothing and is only used for the branch protection
    name: ✅ All tests passed
    if: always()

    needs:
    - pre-setup  # transitive, for accessing settings
    - sanity
    - tests

    runs-on: ubuntu-latest

    timeout-minutes: 1

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
